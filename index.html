<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise 💌</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(
                135deg,
                #1b102b,
                #54245f,
                #a64d79
            );
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stars span {
            position: absolute;
            bottom: -30px;
            font-size: 20px;
            opacity: 0;
            animation: floatUp 9s linear infinite;
            pointer-events: none;
        }

        .stars span:nth-child(1) { left: 10%; animation-delay: 0s; }
        .stars span:nth-child(2) { left: 25%; animation-delay: 2s; }
        .stars span:nth-child(3) { left: 45%; animation-delay: 4s; }
        .stars span:nth-child(4) { left: 65%; animation-delay: 1s; }
        .stars span:nth-child(5) { left: 85%; animation-delay: 3s; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .card {
            width: min(90%, 440px);
            padding: 45px 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
            animation: appear 1.2s ease both;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .envelope {
            font-size: 65px;
            margin-bottom: 20px;
            animation: gentleBounce 2.5s ease-in-out infinite;
        }

        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: clamp(28px, 7vw, 38px);
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .subtitle {
            font-size: 16px;
            line-height: 1.8;
            color: #f8e8ff;
            margin-bottom: 28px;
        }

        .hint {
            font-size: 13px;
            color: #f4cce9;
            margin-bottom: 24px;
        }

        .surprise-button {
            display: inline-block;
            padding: 14px 25px;
            border: none;
            border-radius: 30px;
            background: #fff0f8;
            color: #71365f;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .surprise-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(255, 210, 240, 0.3);
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #ead0f0;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

    <div class="stars" aria-hidden="true">
        <span>💗</span>
        <span>✨</span>
        <span>💜</span>
        <span>🌸</span>
        <span>✨</span>
    </div>

    <main class="card">

        <div class="envelope" aria-hidden="true">💌</div>

        <h1>A Little Surprise<br>Just for You ✨</h1>

        <p class="subtitle">
            Some things are more special<br>
            when you discover them yourself. 💗
        </p>

        <p class="hint">
            ✨ Take a little moment for yourself ✨
        </p>

       <button class="surprise-button" id="startSurpriseBtn" type="button">
    Open Your Surprise 💜
</button>

        <p class="footer">
            Made with a little bit of magic ✨
        </p>

    </main>
<script>
<script>
document.getElementById("startSurpriseBtn").addEventListener("click", () => {
    const audio = new Audio("alfaaz.mp3");

    audio.addEventListener("loadedmetadata", () => {
        audio.currentTime = 72;

        audio.play().then(() => {
            sessionStorage.setItem("birthdayMusicStarted", "yes");
            sessionStorage.setItem("birthdayMusicTime", String(audio.currentTime));
            window.location.href = "page2.html";
        }).catch(error => {
            console.error("Music playback failed:", error);
            alert("Please click the button again to start the music.");
        });
    }, { once: true });
});
</script>
</script>
</body>
</html>
